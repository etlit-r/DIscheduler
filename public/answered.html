<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>回答を保存しました｜DIscheduler</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/assets/lp.css">
  <!-- 回答の完了画面（S3a。docs/design.md §6.4, §6.10.1）
       回答・名前・調整のタイトルなどは表示しない。調整の ID はアドレスの # の後ろにだけ置き、サーバーにも広告の枠にも送らない -->
</head>
<body class="lp">
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <span class="brand-mark"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></span>
        <span class="brand-name">DIscheduler<span class="brand-badge">Bot</span></span>
      </a>
    </div>
  </header>

  <main id="main" class="doc answered">
    <div class="container">
      <article class="doc-body">
        <h1>回答を保存しました</h1>
        <p>あなたの回答は集計に反映されました。</p>
        <p class="answered-actions"><a class="btn btn-primary" id="to-summary" href="/" hidden>集計画面を見る</a></p>
        <!-- donation:start -->
        <aside class="support-card" aria-label="運営の支援">
          <span class="support-cup"><svg class="support-cup-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg></span>
          <div class="support-body">
            <p class="support-lead">DIscheduler は無料で運営しています。役に立ったら、運営を支援していただけるとうれしいです。</p>
            <p><a class="btn btn-secondary btn-small" href="__DONATION_URL__" rel="noopener noreferrer">運営を支援する</a></p>
            <p class="term">任意です。支援の有無で機能は変わりません。</p>
            <p class="term">__DONATION_NOTE__</p>
          </div>
        </aside>
        <!-- donation:end -->
        <!-- ad:start -->
        <aside class="ad-slot" data-ad-slot aria-label="広告">
          <p class="ad-label">広告</p>
          <div class="ad-box"><noscript><p class="ad-off">広告を表示するには JavaScript が必要です。</p></noscript></div>
          <p class="ad-choice"></p>
        </aside>
        <!-- ad:end -->
      </article>
    </div>
  </main>
  <script src="/assets/answered.js" defer></script>
  <!-- ad:start --><script src="/assets/ad-consent.js" defer></script><!-- ad:end -->
</body>
</html>
