# main へのマージ時に Cloudflare Workers へデプロイする（docs/design.md §14）
# - production Environment の承認者が承認するまで実行されない
# - サードパーティの Action はコミット SHA で固定（更新は Dependabot）
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 静的ページに設定値を埋め込む（招待リンク・寄付リンク）
        env:
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          DONATION_URL: ${{ vars.DONATION_URL }}
        run: bash scripts/prepare-public.sh public

      - name: Cloudflare Workers へデプロイ
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          command: deploy
