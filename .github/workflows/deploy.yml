# テストと、main へのマージ時のデプロイ（docs/design.md §14）
# - プルリクエストでは test だけを実行する
# - デプロイの前に approve（production-approval Environment の承認）を通す。承認するまで deploy は実行されない
# - 承認待ちの間に次のマージがあったら、古い承認待ちは取り消す。いちばん新しいマージを承認すれば、
#   その時点の main（それまでのマージをすべて含む）がデプロイされる
# - サードパーティの Action はコミット SHA で固定（更新は Dependabot）
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: 依存のインストール（インストールスクリプトは実行しない）
        run: npm ci --ignore-scripts
      - name: 本番の依存の脆弱性監査（中程度以上で止める。本番の依存は hono と valibot だけ）
        run: npm audit --omit=dev --audit-level=moderate
      - name: 2 か所に書く値がそろっているか（静的配信と Functions のセキュリティヘッダー）
        run: npm run check-sync
      - name: 型検査
        run: npm run typecheck
      - name: テスト
        run: npm test
      - name: Web 画面のビルド
        run: npm run build
      # デプロイのときと同じ手順で、仮の値を静的ページに埋め込めるかを確かめる（置き場所の書き間違いを PR のうちに見つける）
      - name: 静的ページへの埋め込みの確認（寄付リンクあり・なし）
        run: |
          DISCORD_APPLICATION_ID=100000000000000000 PUBLIC_ORIGIN=https://example.com DONATION_URL=https://ko-fi.com/example bash scripts/prepare-public.sh public "$RUNNER_TEMP/dist-a"
          DISCORD_APPLICATION_ID=100000000000000000 bash scripts/prepare-public.sh public "$RUNNER_TEMP/dist-b"

  # 承認だけを行う。秘密の値は使わない（production-approval Environment には secret を置かない）。
  # 承認待ちの間に新しいマージがあれば、この承認待ちは取り消され、新しいほうだけが承認待ちになる
  approve:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: approve-production
      cancel-in-progress: true
    environment:
      name: production-approval
    steps:
      - run: echo "承認されました（${{ github.sha }}）"

  # 実際のデプロイ。途中で止めると Pages と Worker の版がずれるため、実行中のデプロイは取り消さず、順に流す
  deploy:
    needs: approve
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Web 画面のビルド
        run: npm run build

      # 静的ページは public/ を dist/ にコピーしてから設定値を埋め込む。Pages と Worker の設定ファイルにも埋め込む（--config）。
      # 値の形式の確認と、置き換え漏れの確認もこの中で行う
      - name: 静的ページと設定ファイルに設定値を埋め込む
        env:
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          DONATION_URL: ${{ vars.DONATION_URL }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          DISCORD_PUBLIC_KEY: ${{ vars.DISCORD_PUBLIC_KEY }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
        run: bash scripts/prepare-public.sh --config public dist

      # wrangler は npm ci で入れた版（package-lock.json で固定）をそのまま使う。
      # wranglerVersion は指定しない。指定すると、Dependabot が package.json を上げたときに版がずれ、
      # Action がずれた版をインストールスクリプト付きで別に入れてしまう
      # マイグレーションはデプロイより先に当たる。デプロイが終わるまで（失敗したときはその後も）古いコードが新しいスキーマで動くので、
      # マイグレーションは必ず、いま動いている版のコードでもそのまま動く形にする（列を消すのは、どの版も使わなくなってから。docs/design.md §14）
      - name: データベースのマイグレーション
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      # 本体（LP・Web 画面・Web API・Discord からの通信）を Cloudflare Pages へデプロイする。
      # 設定は pages/wrangler.jsonc（前の手順で値を埋め込み済み。配信するのは dist/）。Bot トークンは Pages のプロジェクトの Secret
      - name: Cloudflare Pages へデプロイ
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --cwd pages --branch main --commit-hash ${{ github.sha }} --commit-dirty=true

      # Worker（旧アドレス）は、1 日 2 回の自動処理と、旧アドレスへのアクセスの転送を担当する（Pages のあとにデプロイする）。
      # 公開値は --var で渡す。値の形式は前の手順で検証済み。DONATION_URL は任意なので、設定されているときだけ渡す
      - name: Cloudflare Workers へデプロイ
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --var DISCORD_APPLICATION_ID:${{ vars.DISCORD_APPLICATION_ID }}
            --var DISCORD_PUBLIC_KEY:${{ vars.DISCORD_PUBLIC_KEY }}
            --var PUBLIC_ORIGIN:${{ vars.PUBLIC_ORIGIN }}
            ${{ vars.DONATION_URL != '' && format('--var DONATION_URL:{0}', vars.DONATION_URL) || '' }}
