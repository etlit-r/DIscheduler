# master へのマージ時に Cloudflare Workers へデプロイする（docs/design.md §14）
# - production Environment の承認者が承認するまで実行されない
# - サードパーティの Action はコミット SHA で固定（更新は Dependabot）
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 招待リンクに Application ID を埋め込む
        env:
          APP_ID: ${{ vars.DISCORD_APPLICATION_ID }}
        run: |
          # 数字以外の値が入っていたら止める（置換による書き換えを防ぐ）
          if [[ ! "$APP_ID" =~ ^[0-9]{17,20}$ ]]; then
            echo "::error::Environment variable DISCORD_APPLICATION_ID が未設定か、形式が正しくありません"
            exit 1
          fi
          sed -i "s/__DISCORD_APPLICATION_ID__/${APP_ID}/g" public/index.html
          if grep -q "__DISCORD_APPLICATION_ID__" public/index.html; then
            echo "::error::招待リンクの置き換えに失敗しました"
            exit 1
          fi

      - name: Cloudflare Workers へデプロイ
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          command: deploy
